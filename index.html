<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Ascend</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;height:100vh;background:#0d0d0d;color:white;overflow:hidden}
.sidebar{width:220px;background:#141414;padding:20px}
.menu-item{margin-bottom:15px;cursor:pointer;opacity:.7}
.menu-item:hover{opacity:1}
.menu-item.active{opacity:1;font-weight:bold}
.main{flex:1;padding:30px;overflow:auto;position:relative}
.card{background:#1b1b1b;padding:20px;border-radius:8px;margin-bottom:20px}
button{padding:8px 12px;margin:5px;border:none;background:white;color:black;font-weight:bold;cursor:pointer}

/* HUD */
.hud{
position:absolute;
top:20px;
right:20px;
background:#111;
padding:15px;
border-radius:8px;
width:220px;
}
.bar{
height:15px;
background:#333;
border-radius:8px;
overflow:hidden;
margin-bottom:10px;
}
.fill{
height:100%;
background:#00ffcc;
}

/* CHARACTER */
.character-container{
width:100%;
height:450px;
display:flex;
justify-content:center;
align-items:center;
perspective:900px;
}
.character{
width:120px;
height:300px;
position:relative;
transition:transform .1s linear;
display:flex;
flex-direction:column;
align-items:center;
}
.head{
width:100px;
height:100px;
background:#222;
border-radius:50%;
position:relative;
box-shadow:0 0 30px #00ffff22;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}
.eyes{
width:80%;
display:flex;
justify-content:space-between;
position:relative;
top:10px;
}
.eye{
width:20px;
height:20px;
background:white;
border-radius:50%;
overflow:hidden;
position:relative;
}
.pupil{
width:10px;
height:10px;
background:black;
border-radius:50%;
position:absolute;
top:5px;
left:5px;
transition:.05s;
}
.mouth{
width:40px;
height:12px;
background:#111;
border-radius:0 0 20px 20px;
position:absolute;
bottom:10px;
left:30%;
}

/* BODY */
.body{
width:60px;
height:100px;
background:#333;
border-radius:20px;
position:relative;
margin-top:10px;
display:flex;
justify-content:center;
align-items:flex-start;
flex-direction:column;
}
.arm{
width:15px;
height:60px;
background:#333;
position:absolute;
top:10px;
}
.arm.left{left:-20px;}
.arm.right{right:-20px;}
.leg{
width:20px;
height:70px;
background:#333;
position:absolute;
bottom:-70px;
}
.leg.left{left:0;}
.leg.right{right:0;}

/* STATUS VISUALS */
.poison{filter:hue-rotate(90deg)}
.burn{animation:burn 1s infinite}
.freeze{filter:hue-rotate(180deg) brightness(1.2)}
.bleed{animation:bleed .8s infinite}
.curse{box-shadow:0 0 40px purple}
.weak{opacity:.6}
@keyframes burn{0%{box-shadow:0 0 10px red}50%{box-shadow:0 0 30px orange}100%{box-shadow:0 0 10px red}}
@keyframes bleed{0%{transform:translateX(0)}50%{transform:translateX(2px)}100%{transform:translateX(0)}}

/* ENTITY */
.entity-container{
width:150px;
height:150px;
border-radius:50%;
background:#00f;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-weight:bold;
position:relative;
margin:20px auto;
cursor:pointer;
transition:transform .2s ease;
}
.entity-speech{
position:absolute;
top:-30px;
width:200px;
text-align:center;
font-size:14px;
}
</style>
</head>
<body>
<div class="sidebar">
<h2>SISTEMA</h2>
<div class="menu-item active" onclick="showPage('dashboard',this)">Painel</div>
<div class="menu-item" onclick="showPage('profile',this)">Perfil</div>
</div>

<div class="main" id="content"></div>

<script>
/* STATE */
let karma = parseInt(localStorage.getItem("karma"))||0;
let player = JSON.parse(localStorage.getItem("player"))||{name:null,hp:100,maxHp:100,resistance:10};
let activeEffects = JSON.parse(localStorage.getItem("effects"))||[];
let lastEntityInteraction = 0;

/* SAVE */
function saveAll(){
localStorage.setItem("karma",karma);
localStorage.setItem("player",JSON.stringify(player));
localStorage.setItem("effects",JSON.stringify(activeEffects));
}

/* PAGE CONTROL */
function showPage(page,el){
document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
el.classList.add("active");
if(page==="dashboard") renderDashboard();
if(page==="profile") renderProfile();
}

/* DASHBOARD */
function renderDashboard(){
document.getElementById("content").innerHTML=`
<h1>System Ascend</h1>
<div class="card">
${!player.name?'<input id="name" placeholder="Nome"><button onclick="start()">Criar</button>':
'<button onclick="renderProfile()">Abrir Perfil</button>'}
<button onclick="battle(false)">Batalha Normal</button>
<button onclick="battle(true)">Enfrentar Boss</button>
</div>
<div class="entity-container" onclick="interactEntity()">
<div class="entity-speech" id="entitySpeech">Causar o Caos -5 Karma</div>ENTIDADE
</div>
`;
setupCharacter();
updateEntitySpeech();
}

/* PROFILE */
function renderProfile(){
const resistance = player.resistance || 0;
document.getElementById("content").innerHTML=`
<h1>${player.name}</h1>
<div class="hud">
<div>HP</div>
<div class="bar"><div class="fill" style="width:${(player.hp/player.maxHp)*100}%"></div></div>
<div>Karma: ${karma}</div>
<div>Resistência: ${resistance}%</div>
</div>

<div class="character-container">
<div class="character" id="character">
<div class="head">
<div class="eyes">
<div class="eye"><div class="pupil" id="pupilL"></div></div>
<div class="eye"><div class="pupil" id="pupilR"></div></div>
</div>
<div class="mouth"></div>
</div>
<div class="body">
<div class="arm left"></div>
<div class="arm right"></div>
<div class="leg left"></div>
<div class="leg right"></div>
</div>
</div>
</div>

<div class="card">
<button onclick="interactEntity()">Falar com a entidade</button>
</div>
`;
setupCharacter();
applyEffects();
updateEntitySpeech();
}

/* CHARACTER MOVEMENT */
function setupCharacter(){
const character=document.getElementById("character");
if(!character) return;
const pupilL=document.getElementById("pupilL");
const pupilR=document.getElementById("pupilR");

document.onmousemove=function(e){move(e.clientX,e.clientY)};
document.ontouchmove=function(e){move(e.touches[0].clientX,e.touches[0].clientY)};

function move(x,y){
let rect=character.getBoundingClientRect();
let cx=rect.left+rect.width/2;
let cy=rect.top+rect.height/2;
let dx=(x-cx)/20;
let dy=(y-cy)/20;
pupilL.style.transform=`translate(${dx}px,${dy}px)`;
pupilR.style.transform=`translate(${dx}px,${dy}px)`;
character.style.transform=`rotateX(${-(y-cy)/30}deg) rotateY(${(x-cx)/30}deg)`;
}
}

/* BATTLE SYSTEM */
let enemyAI={normal:{debuffChance:0.3,damage:10},boss:{debuffChance:0.7,damage:20}};
function battle(isBoss){
let enemy=isBoss?enemyAI.boss:enemyAI.normal;
player.hp-=enemy.damage;
if(player.hp<0)player.hp=0;
if(Math.random()<enemy.debuffChance) applyRandomEffect();
if(player.hp===0){
karma-=10;
alert("Você foi derrotado.");
player.hp=player.maxHp;
}else{
karma+=5;
alert("Você venceu.");
}
saveAll();
renderProfile();
}

/* EFFECTS */
function applyRandomEffect(){
let effects=["poison","burn","freeze","bleed","curse","weak"];
let type=effects[Math.floor(Math.random()*effects.length)];
if(Math.random()*100<player.resistance) return;
activeEffects.push({type:type,duration:5000});
saveAll();
}
function applyEffects(){
const character=document.getElementById("character");
if(!character) return;
activeEffects.forEach(effect=>{
character.classList.add(effect.type);
setTimeout(()=>{
character.classList.remove(effect.type);
activeEffects=activeEffects.filter(e=>e!==effect);
saveAll();
},effect.duration);
});
}

/* ENTITY INTERACTION */
function interactEntity(){
let now = Date.now();
if(now - lastEntityInteraction < 30000){
alert("A entidade está ocupada, tente mais tarde.");
return;
}
lastEntityInteraction = now;
karma -=5;
updateEntitySpeech();
alert("A entidade respondeu! Karma -5");
saveAll();
renderProfile();
}
function updateEntitySpeech(){
let entitySpeech = document.getElementById("entitySpeech");
if(!entitySpeech) return;
if(karma<0){
entitySpeech.textContent="Você está no limite do caos!";
}else{
entitySpeech.textContent="Causar o Caos -5 Karma";
}
}

/* START */
function start(){
const nameInput = document.getElementById("name").value;
if(!nameInput) return alert("Digite um nome");
player.name = nameInput;
player.hp = 100;
player.maxHp = 100;
player.resistance = 10;
saveAll();
renderDashboard();
}

/* FORCE INITIAL RENDER */
renderDashboard();

</script>
</body>
</html>
