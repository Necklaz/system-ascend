<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Ascend</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;height:100vh;background:#0d0d0d;color:white;overflow:hidden}
.sidebar{width:220px;background:#141414;padding:20px}
.menu-item{margin-bottom:15px;cursor:pointer;opacity:.7}
.menu-item:hover{opacity:1}
.menu-item.active{opacity:1;font-weight:bold}
.main{flex:1;padding:30px;overflow:auto;position:relative}
.card{background:#1b1b1b;padding:20px;border-radius:8px;margin-bottom:20px}
button{padding:8px 12px;margin:5px;border:none;background:white;color:black;font-weight:bold;cursor:pointer}

/* CHARACTER */

.character-container{
width:100%;
height:450px;
display:flex;
justify-content:center;
align-items:center;
perspective:900px;
}

.character{
width:200px;
height:320px;
position:relative;
transition:transform .1s linear;
}

.head{
width:160px;
height:160px;
background:#222;
border-radius:50%;
margin:auto;
position:relative;
box-shadow:0 0 30px #00ffff22;
}

.body{
width:140px;
height:150px;
background:#333;
margin:10px auto 0 auto;
border-radius:20px;
}

.eyes{
position:absolute;
top:60px;
width:100%;
display:flex;
justify-content:space-around;
}

.eye{
width:36px;
height:36px;
background:white;
border-radius:50%;
overflow:hidden;
position:relative;
}

.pupil{
width:16px;
height:16px;
background:black;
border-radius:50%;
position:absolute;
top:10px;
left:10px;
transition:.05s;
}

.mouth{
width:50px;
height:18px;
background:#111;
border-radius:0 0 30px 30px;
position:absolute;
bottom:35px;
left:55px;
}

/* STATUS VISUALS */

.poison{filter:hue-rotate(90deg)}
.burn{animation:burn 1s infinite}
.freeze{filter:hue-rotate(180deg) brightness(1.2)}
.bleed{animation:bleed .8s infinite}
.curse{box-shadow:0 0 40px purple}
.weak{opacity:.6}

@keyframes burn{
0%{box-shadow:0 0 10px red}
50%{box-shadow:0 0 30px orange}
100%{box-shadow:0 0 10px red}
}

@keyframes bleed{
0%{transform:translateX(0)}
50%{transform:translateX(2px)}
100%{transform:translateX(0)}
}

</style>
</head>
<body>

<div class="sidebar">
<h2>SISTEMA</h2>
<div class="menu-item active" onclick="showPage('dashboard',this)">Painel</div>
<div class="menu-item" onclick="showPage('profile',this)">Perfil</div>
</div>

<div class="main" id="content"></div>

<script>

let karma=parseInt(localStorage.getItem("karma"))||0;
let player=JSON.parse(localStorage.getItem("player"))||null;
let status=JSON.parse(localStorage.getItem("status"))||null;
let statusTimeout=null;

/* SAVE */

function saveAll(){
localStorage.setItem("karma",karma);
localStorage.setItem("player",JSON.stringify(player));
localStorage.setItem("status",JSON.stringify(status));
}

/* PAGE */

function showPage(page,el){
document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
el.classList.add("active");
if(page==="dashboard")renderDashboard();
if(page==="profile")renderProfile();
}

/* DASHBOARD */

function renderDashboard(){
document.getElementById("content").innerHTML=`
<h1>System Ascend</h1>
<div class="card">
${!player?'<input id="name" placeholder="Nome"><button onclick="start()">Criar</button>':
'<button onclick="renderProfile()">Abrir Perfil</button>'}
<button onclick="battle()">Simular Batalha</button>
</div>
`;
}

/* PROFILE */

function renderProfile(){
document.getElementById("content").innerHTML=`
<h1>${player.name}</h1>
<div class="card">Karma: ${karma}</div>

<div class="character-container">
  <div class="character" id="character">
    <div class="head">
      <div class="eyes">
        <div class="eye"><div class="pupil" id="pupilL"></div></div>
        <div class="eye"><div class="pupil" id="pupilR"></div></div>
      </div>
      <div class="mouth"></div>
    </div>
    <div class="body"></div>
  </div>
</div>
`;

setupCharacter();
applyStatus();
}

/* CHARACTER MOVEMENT */

function setupCharacter(){
const character=document.getElementById("character");
const pupilL=document.getElementById("pupilL");
const pupilR=document.getElementById("pupilR");

document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move);

function move(e){
let x=e.touches?e.touches[0].clientX:e.clientX;
let y=e.touches?e.touches[0].clientY:e.clientY;
let rect=character.getBoundingClientRect();
let centerX=rect.left+rect.width/2;
let centerY=rect.top+rect.height/2;

let dx=(x-centerX)/20;
let dy=(y-centerY)/20;

pupilL.style.transform=`translate(${dx}px,${dy}px)`;
pupilR.style.transform=`translate(${dx}px,${dy}px)`;

let rx=(y-centerY)/30;
let ry=(x-centerX)/30;
character.style.transform=`rotateX(${-rx}deg) rotateY(${ry}deg)`;
}
}

/* BATTLE SYSTEM */

function battle(){
let effects=["poison","burn","freeze","bleed","curse","weak",null];
let random=effects[Math.floor(Math.random()*effects.length)];

if(random){
status={type:random,duration:5000};
saveAll();
alert("Você sofreu: "+random);
renderProfile();
}else{
alert("Você venceu sem sofrer efeitos.");
}
}

/* APPLY STATUS */

function applyStatus(){
const character=document.getElementById("character");
if(!status)return;

character.classList.add(status.type);

clearTimeout(statusTimeout);
statusTimeout=setTimeout(()=>{
character.classList.remove(status.type);
status=null;
saveAll();
},status.duration);
}

/* START */

function start(){
player={name:document.getElementById("name").value};
saveAll();
renderDashboard();
}

renderDashboard();

</script>
</body>
</html>
