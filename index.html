<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Ascend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    body {
      display: flex;
      height: 100vh;
    }

    body.dark {
      background-color: #0e0e0e;
      color: white;
    }

    body.light {
      background-color: #f4f4f4;
      color: #111;
    }

    .sidebar {
      width: 220px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    body.dark .sidebar { background-color: #141414; }
    body.light .sidebar { background-color: #ffffff; }

    .sidebar h2 {
      margin-bottom: 40px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .menu-item {
      margin-bottom: 20px;
      cursor: pointer;
      opacity: 0.6;
    }

    .menu-item:hover { opacity: 1; }
    .menu-item.active { font-weight: bold; opacity: 1; }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    body.dark .card { background-color: #1c1c1c; }
    body.light .card {
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .xp-bar {
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      background-color: white;
    }

    .toggle-btn, .xp-btn {
      padding: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    body.dark .toggle-btn,
    body.dark .xp-btn {
      background-color: white;
      color: black;
    }

    body.light .toggle-btn,
    body.light .xp-btn {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body class="dark">

  <div class="sidebar">
    <h2>SYSTEM</h2>
    <div class="menu-item active" onclick="showPage('dashboard', this)">Dashboard</div>
    <div class="menu-item" onclick="showPage('goals', this)">Goals</div>
    <div class="menu-item" onclick="showPage('streak', this)">Streak</div>
    <div class="menu-item" onclick="showPage('profile', this)">Profile</div>

    <button class="toggle-btn" onclick="toggleMode()">Toggle Mode</button>
  </div>

  <div class="main" id="content"></div>

  <script>

    let xp = parseInt(localStorage.getItem("xp")) || 0;

    const missions = [
      { name: "Treino físico intenso", type: "Daily", xp: 20 },
      { name: "Estudo foco total 2h", type: "Daily", xp: 20 },
      { name: "Meta semanal concluída", type: "Weekly", xp: 100 },
      { name: "Projeto entregue", type: "Hard", xp: 250 },
      { name: "Desafio extremo completo", type: "Legendary", xp: 500 }
    ];

    function calculateLevel(totalXp) {
      let level = 1;
      let xpNeeded = 100;

      while (totalXp >= xpNeeded) {
        totalXp -= xpNeeded;
        level++;
        xpNeeded = level * 100;
      }

      return level;
    }

    function xpForNextLevel(level) {
      return level * 100;
    }

    function currentXpInLevel(totalXp) {
      let level = 1;
      let xpNeeded = 100;

      while (totalXp >= xpNeeded) {
        totalXp -= xpNeeded;
        level++;
        xpNeeded = level * 100;
      }

      return totalXp;
    }

    function addXp(amount) {
      xp += amount;
      localStorage.setItem("xp", xp);
      renderDashboard();
    }

    function renderDashboard() {
      const level = calculateLevel(xp);
      const xpInLevel = currentXpInLevel(xp);
      const nextLevelXp = xpForNextLevel(level);
      const progressPercent = (xpInLevel / nextLevelXp) * 100;

      const content = document.getElementById("content");

      content.innerHTML = `
        <h1>Dashboard</h1>
        <div class="card">
          <h3>Level ${level}</h3>
          <p>XP: ${xpInLevel} / ${nextLevelXp}</p>
          <div class="xp-bar">
            <div class="xp-fill" style="width:${progressPercent}%"></div>
          </div>
        </div>
      `;
    }

    function renderGoals() {
      const content = document.getElementById("content");

      let missionsHTML = missions.map((mission, index) => `
        <div class="card">
          <h3>${mission.name}</h3>
          <p>Type: ${mission.type}</p>
          <p>Reward: +${mission.xp} XP</p>
          <button class="xp-btn" onclick="completeMission(${index})">
            Complete Mission
          </button>
        </div>
      `).join("");

      content.innerHTML = `
        <h1>Goals</h1>
        ${missionsHTML}
      `;
    }

    function completeMission(index) {
      addXp(missions[index].xp);
    }

    function showPage(page, element) {
      document.querySelectorAll(".menu-item").forEach(item => {
        item.classList.remove("active");
      });

      element.classList.add("active");

      if (page === "dashboard") renderDashboard();
      if (page === "goals") renderGoals();

      if (page === "streak") {
        document.getElementById("content").innerHTML = `
          <h1>Streak</h1>
          <div class="card">
            <p>Coming soon.</p>
          </div>
        `;
      }

      if (page === "profile") {
        document.getElementById("content").innerHTML = `
          <h1>Profile</h1>
          <div class="card">
            <p>Total XP: ${xp}</p>
            <p>Current Level: ${calculateLevel(xp)}</p>
          </div>
        `;
      }
    }

    function toggleMode() {
      const body = document.body;

      if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
      } else {
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.remove("dark", "light");
      document.body.classList.add(savedTheme);
    }

    showPage("dashboard", document.querySelector(".menu-item"));

  </script>

</body>
</html>
