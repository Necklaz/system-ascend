<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Ascend</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;height:100vh;background:#0e0e0e;color:white;overflow:hidden}
.sidebar{width:240px;background:#141414;padding:20px}
.menu-item{margin-bottom:15px;cursor:pointer;opacity:.7}
.menu-item:hover{opacity:1}
.menu-item.active{font-weight:bold;opacity:1}
.main{flex:1;padding:30px;overflow:auto;position:relative}
.card{background:#1c1c1c;padding:20px;border-radius:8px;margin-bottom:20px}
button{padding:8px 12px;margin:5px;border:none;background:white;color:black;font-weight:bold;cursor:pointer}

/* KARMA VISUAL */

.good-karma{box-shadow:0 0 40px #00ffcc}
.bad-karma{box-shadow:0 0 40px #ff0033}

/* GUIDE ORB */

#guide{
position:absolute;
width:90px;height:90px;border-radius:50%;
background:radial-gradient(circle,#00ffff,#002222);
box-shadow:0 0 30px #00ffff;
display:none;align-items:center;justify-content:center;
animation:pulse 2s infinite;
cursor:pointer;
z-index:999;
flex-direction:column;
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.1)}
}

#guideText{
position:absolute;
bottom:110px;
width:260px;
background:#111;
padding:12px;
border-radius:8px;
font-size:14px;
}

.choice{
display:block;
margin-top:6px;
padding:6px;
background:#222;
cursor:pointer;
border-radius:4px;
}

.choice:hover{background:#333}

</style>
</head>
<body>

<div class="sidebar">
<h2>SYSTEM</h2>
<div class="menu-item active" onclick="showPage('dashboard',this)">Dashboard</div>
<div class="menu-item" onclick="showPage('profile',this)">Profile</div>
</div>

<div class="main" id="content"></div>

<div id="guide">
<div id="guideText"></div>
</div>

<script>

let karma=parseInt(localStorage.getItem("karma"))||0;
let entityMood=localStorage.getItem("entityMood")||"neutral";
let memory=JSON.parse(localStorage.getItem("entityMemory"))||[];
let player=JSON.parse(localStorage.getItem("player"))||null;
let guide=document.getElementById("guide");
let guideText=document.getElementById("guideText");

/* SAVE SYSTEM */

function saveAll(){
localStorage.setItem("karma",karma);
localStorage.setItem("entityMood",entityMood);
localStorage.setItem("entityMemory",JSON.stringify(memory));
localStorage.setItem("player",JSON.stringify(player));
}

/* KARMA SYSTEM */

function updateKarma(value){
karma+=value;
if(karma>50) entityMood="pleased";
if(karma<-50) entityMood="hostile";
if(karma<=50 && karma>=-50) entityMood="neutral";
saveAll();
updateKarmaVisual();
}

function updateKarmaVisual(){
guide.classList.remove("good-karma","bad-karma");
if(karma>20) guide.classList.add("good-karma");
if(karma<-20) guide.classList.add("bad-karma");
}

/* ENTITY DIALOG SYSTEM */

function showDialogue(text,choices){
guide.style.display="flex";
guide.style.top="60px";
guide.style.right="60px";

guideText.innerHTML="<div>"+text+"</div>";

if(choices){
choices.forEach(c=>{
let div=document.createElement("div");
div.className="choice";
div.innerText=c.text;
div.onclick=()=>{
c.effect();
guide.style.display="none";
};
guideText.appendChild(div);
});
}
}

function entitySpeak(){

if(entityMood==="pleased"){
showDialogue("You walk a path of light. Interesting.",
[
{text:"Continue helping others (+10 Karma)",effect:()=>updateKarma(10)},
{text:"Mock the weak (-15 Karma)",effect:()=>updateKarma(-15)}
]);
}

else if(entityMood==="hostile"){
showDialogue("Your corruption grows. I approve.",
[
{text:"Embrace darkness (-10 Karma)",effect:()=>updateKarma(-10)},
{text:"Seek redemption (+20 Karma)",effect:()=>updateKarma(20)}
]);
}

else{
showDialogue("You remain balanced... for now.",
[
{text:"Do a noble act (+5 Karma)",effect:()=>updateKarma(5)},
{text:"Cause chaos (-5 Karma)",effect:()=>updateKarma(-5)}
]);
}
}

/* PROFILE */

function renderProfile(){
document.getElementById("content").innerHTML=`
<h1>${player?player.name:"Unknown"}</h1>
<div class="card">
Karma: ${karma}
<button onclick="entitySpeak()">Speak with Entity</button>
</div>
`;
updateKarmaVisual();
}

/* DASHBOARD */

function renderDashboard(){
document.getElementById("content").innerHTML=`
<h1>System Ascend</h1>
<div class="card">
${!player?'<input id="name" placeholder="Name"><button onclick="start()">Start</button>':
'<button onclick="renderProfile()">Open Profile</button>'}
</div>
`;
}

/* ENTITY MEMORY EVOLUTION */

function entityEvolution(){
if(memory.length>5 && entityMood==="hostile"){
showDialogue("You have chosen darkness repeatedly. I will remember this.");
}
if(memory.length>5 && entityMood==="pleased"){
showDialogue("Consistency in virtue. Unexpected.");
}
}

/* START */

function start(){
player={name:document.getElementById("name").value};
memory.push("created");
saveAll();
renderDashboard();
}

/* PAGE SWITCH */

function showPage(page,el){
document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
el.classList.add("active");
if(page==="dashboard")renderDashboard();
if(page==="profile")renderProfile();
}

renderDashboard();
entityEvolution();

</script>
</body>
</html>
