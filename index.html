<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Ascend</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;height:100vh;background:#0e0e0e;color:white}
.sidebar{width:240px;background:#141414;padding:20px}
.menu-item{margin-bottom:15px;cursor:pointer;opacity:.7}
.menu-item:hover{opacity:1}
.menu-item.active{font-weight:bold;opacity:1}
.main{flex:1;padding:30px;overflow:auto}
.card{background:#1c1c1c;padding:20px;border-radius:8px;margin-bottom:20px}
button{padding:8px 12px;margin-top:8px;cursor:pointer;border:none;background:white;color:black;font-weight:bold}
.xp-bar{width:100%;height:10px;background:#333;border-radius:5px;margin-top:10px}
.xp-fill{height:100%;background:white}
.skill{border-left:4px solid gray;padding-left:10px;margin-bottom:10px}
.unlocked{border-left:4px solid gold}
</style>
</head>

<body>

<div class="sidebar">
<h2>SYSTEM</h2>
<div class="menu-item active" onclick="showPage('dashboard',this)">Dashboard</div>
<div class="menu-item" onclick="showPage('profile',this)">Profile</div>
<div class="menu-item" onclick="showPage('skills',this)">Skill Tree</div>
</div>

<div class="main" id="content"></div>

<script>

let xp=parseInt(localStorage.getItem("xp"))||0;
let player=JSON.parse(localStorage.getItem("player"))||null;

function save(){
localStorage.setItem("xp",xp);
localStorage.setItem("player",JSON.stringify(player));
}

function calculateLevel(totalXp){
let level=1;
let xpNeeded=100;
while(totalXp>=xpNeeded){
totalXp-=xpNeeded;
level++;
xpNeeded=level*100;
}
return level;
}

function xpForNext(level){
return level*100;
}

function createCharacter(name,cls,race){

player={
name:name,
class:cls,
race:race,
level:1,
skillPoints:0,
attributes:{strength:5,intelligence:5,discipline:5,energy:5},
skillsUnlocked:[]
};

if(cls==="Warrior") player.attributes.strength+=5;
if(cls==="Scholar") player.attributes.intelligence+=5;
if(cls==="Monk") player.attributes.discipline+=5;
if(cls==="Strategist"){
player.attributes.strength+=2;
player.attributes.intelligence+=2;
player.attributes.discipline+=2;
player.attributes.energy+=2;
}

save();
renderDashboard();
}

function levelCheck(){
let lvl=calculateLevel(xp);
if(lvl>player.level){
let diff=lvl-player.level;
player.skillPoints+=diff*2;
if(player.skillsUnlocked.includes("Adaptable")) player.skillPoints+=diff;
if(player.race==="Half-Orc") player.attributes.strength+=diff;
player.level=lvl;
save();
}
}

function missionReward(base,type){
let reward=base;

if(player.class==="Warrior" && player.skillsUnlocked.includes("Brutal Force") && type==="Hard") reward*=1.2;
if(player.class==="Warrior" && player.skillsUnlocked.includes("Unstoppable") && type==="Legendary") reward*=1.2;

if(player.class==="Scholar" && player.skillsUnlocked.includes("Deep Focus") && type==="Weekly") reward*=1.25;
if(player.skillsUnlocked.includes("Analytical Mind")) reward*=1.1;

if(player.race==="Dragonborn") reward*=1.1;
if(player.race==="Half-Elf") reward*=1.05;
if(player.race==="Tiefling" && type==="Legendary") reward*=1.1;
if(player.race==="Orc" && type==="Hard") reward*=1.15;
if(player.race==="Gnome" && type==="Weekly") reward*=1.15;
if(player.race==="Elf" && type==="Weekly") reward*=1.1;

return Math.floor(reward);
}

function completeMission(type){
let base=100;
if(type==="Hard") base=250;
if(type==="Legendary") base=500;
if(type==="Daily") base=20;

let reward=missionReward(base,type);
xp+=reward;
levelCheck();
save();
renderDashboard();
}

function unlockSkill(name){
if(player.skillPoints<=0) return;
if(player.skillsUnlocked.includes(name)) return;
player.skillsUnlocked.push(name);
player.skillPoints--;
save();
renderSkills();
}

function renderDashboard(){

if(!player){
document.getElementById("content").innerHTML=`
<div class="card">
<input id="name" placeholder="Name"><br>
<select id="race">
<option>Human</option><option>Elf</option><option>Dwarf</option>
<option>Orc</option><option>Halfling</option><option>Tiefling</option>
<option>Dragonborn</option><option>Gnome</option>
<option>Half-Elf</option><option>Half-Orc</option>
</select><br>
<select id="class">
<option>Warrior</option><option>Scholar</option>
<option>Monk</option><option>Strategist</option>
</select><br>
<button onclick="start()">Start</button>
</div>`;
return;
}

let lvl=calculateLevel(xp);
let next=xpForNext(lvl);
let progress=(xp%next)/next*100;

document.getElementById("content").innerHTML=`
<h1>${player.name}</h1>
<div class="card">
<p>Race: ${player.race}</p>
<p>Class: ${player.class}</p>
<p>Level: ${lvl}</p>
<p>Skill Points: ${player.skillPoints}</p>
<div class="xp-bar"><div class="xp-fill" style="width:${progress}%"></div></div>
</div>

<div class="card">
<button onclick="completeMission('Daily')">Daily</button>
<button onclick="completeMission('Weekly')">Weekly</button>
<button onclick="completeMission('Hard')">Hard</button>
<button onclick="completeMission('Legendary')">Legendary</button>
</div>
`;
}

function renderProfile(){
document.getElementById("content").innerHTML=`
<div class="card">
<p>Strength: ${player.attributes.strength}</p>
<p>Intelligence: ${player.attributes.intelligence}</p>
<p>Discipline: ${player.attributes.discipline}</p>
<p>Energy: ${player.attributes.energy}</p>
</div>`;
}

function renderSkills(){

let classSkills={
Warrior:["Brutal Force","Unstoppable","Iron Will"],
Scholar:["Deep Focus","Analytical Mind","Efficiency"],
Monk:["Inner Balance","Focused Spirit","Calm Mind"],
Strategist:["Optimizer","Tactical Insight","Momentum"]
};

let raceSkill={
Human:"Adaptable",
Elf:"Arcane Mind",
Dwarf:"Stone Skin",
Orc:"Berserker",
Halfling:"Lucky",
Tiefling:"Infernal Pact",
Dragonborn:"Draconic Power",
Gnome:"Genius",
"Half-Elf":"Hybrid Talent",
"Half-Orc":"Savage Growth"
};

let html=`<h1>Skill Tree</h1><div class="card">`;

classSkills[player.class].forEach(s=>{
let unlocked=player.skillsUnlocked.includes(s);
html+=`<div class="skill ${unlocked?'unlocked':''}">
<p>${s}</p>
<button onclick="unlockSkill('${s}')">Unlock</button>
</div>`;
});

let rs=raceSkill[player.race];
let unlocked=player.skillsUnlocked.includes(rs);
html+=`<h3>Racial Skill</h3>
<div class="skill ${unlocked?'unlocked':''}">
<p>${rs}</p>
<button onclick="unlockSkill('${rs}')">Unlock</button>
</div>`;

html+=`</div>`;
document.getElementById("content").innerHTML=html;
}

function start(){
createCharacter(
document.getElementById("name").value,
document.getElementById("class").value,
document.getElementById("race").value
);
}

function showPage(page,el){
document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
el.classList.add("active");
if(page==="dashboard") renderDashboard();
if(page==="profile") renderProfile();
if(page==="skills") renderSkills();
}

renderDashboard();

</script>

</body>
</html>
