<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Ascend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    body {
      display: flex;
      height: 100vh;
    }

    body.dark {
      background-color: #0e0e0e;
      color: white;
    }

    body.light {
      background-color: #f4f4f4;
      color: #111;
    }

    .sidebar {
      width: 220px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    body.dark .sidebar { background-color: #141414; }
    body.light .sidebar { background-color: #ffffff; }

    .sidebar h2 {
      margin-bottom: 40px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .menu-item {
      margin-bottom: 20px;
      cursor: pointer;
      opacity: 0.6;
    }

    .menu-item:hover { opacity: 1; }
    .menu-item.active { font-weight: bold; opacity: 1; }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    body.dark .card { background-color: #1c1c1c; }
    body.light .card {
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .xp-bar {
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      background-color: white;
      width: 0%;
    }

    .toggle-btn, .xp-btn {
      padding: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    body.dark .toggle-btn,
    body.dark .xp-btn {
      background-color: white;
      color: black;
    }

    body.light .toggle-btn,
    body.light .xp-btn {
      background-color: black;
      color: white;
    }
  </style>
</head>

<body class="dark">

  <div class="sidebar">
    <h2>SYSTEM</h2>
    <div class="menu-item active" onclick="showPage('dashboard', this)">Dashboard</div>
    <div class="menu-item" onclick="showPage('goals', this)">Goals</div>
    <div class="menu-item" onclick="showPage('streak', this)">Streak</div>
    <div class="menu-item" onclick="showPage('profile', this)">Profile</div>

    <button class="toggle-btn" onclick="toggleMode()">Toggle Mode</button>
  </div>

  <div class="main" id="content"></div>

  <script>

    let xp = parseInt(localStorage.getItem("xp")) || 0;

    function getLevel() {
      return Math.floor(xp / 100) + 1;
    }

    function getXpForNextLevel() {
      return getLevel() * 100;
    }

    function getXpProgress() {
      return xp % 100;
    }

    function addXp(amount) {
      xp += amount;
      localStorage.setItem("xp", xp);
      renderDashboard();
    }

    function renderDashboard() {
      const level = getLevel();
      const progress = getXpProgress();
      const nextLevelXp = getXpForNextLevel();

      const content = document.getElementById("content");

      content.innerHTML = `
        <h1>Dashboard</h1>
        <div class="card">
          <h3>Level ${level}</h3>
          <p>XP: ${progress} / 100</p>
          <div class="xp-bar">
            <div class="xp-fill" style="width:${progress}%"></div>
          </div>
          <button class="xp-btn" onclick="addXp(20)">Gain 20 XP</button>
        </div>
      `;
    }

    function showPage(page, element) {
      document.querySelectorAll(".menu-item").forEach(item => {
        item.classList.remove("active");
      });

      element.classList.add("active");

      if (page === "dashboard") renderDashboard();

      if (page === "goals") {
        document.getElementById("content").innerHTML = `
          <h1>Goals</h1>
          <div class="card">
            <p>No goals added yet.</p>
          </div>
        `;
      }

      if (page === "streak") {
        document.getElementById("content").innerHTML = `
          <h1>Streak</h1>
          <div class="card">
            <p>Current streak: 5 days</p>
          </div>
        `;
      }

      if (page === "profile") {
        document.getElementById("content").innerHTML = `
          <h1>Profile</h1>
          <div class="card">
            <p>Total XP: ${xp}</p>
          </div>
        `;
      }
    }

    function toggleMode() {
      const body = document.body;

      if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        body.classList.add("light");
        localStorage.setItem("theme", "light");
      } else {
        body.classList.remove("light");
        body.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    }

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      document.body.classList.remove("dark", "light");
      document.body.classList.add(savedTheme);
    }

    showPage("dashboard", document.querySelector(".menu-item"));

  </script>

</body>
</html>
