<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Ascend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0e0e0e;
      color: white;
    }

    .sidebar {
      width: 220px;
      background-color: #141414;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin-bottom: 40px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .menu-item {
      margin-bottom: 20px;
      cursor: pointer;
      color: #aaa;
      transition: 0.2s;
    }

    .menu-item:hover {
      color: white;
    }

    .menu-item.active {
      color: white;
      font-weight: bold;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .xp-bar {
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin-top: 10px;
    }

    .xp-fill {
      width: 40%;
      height: 100%;
      background-color: white;
      border-radius: 5px;
    }

    h1 {
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h2>SYSTEM</h2>
    <div class="menu-item active" onclick="showPage('dashboard', this)">Dashboard</div>
    <div class="menu-item" onclick="showPage('goals', this)">Goals</div>
    <div class="menu-item" onclick="showPage('streak', this)">Streak</div>
    <div class="menu-item" onclick="showPage('profile', this)">Profile</div>
  </div>

  <div class="main" id="content">
  </div>

  <script>
    function showPage(page, element) {

      document.querySelectorAll(".menu-item").forEach(item => {
        item.classList.remove("active");
      });

      element.classList.add("active");

      const content = document.getElementById("content");

      if (page === "dashboard") {
        content.innerHTML = `
          <h1>Dashboard</h1>
          <div class="card">
            <h3>Level 4</h3>
            <p>XP: 240 / 500</p>
            <div class="xp-bar">
              <div class="xp-fill"></div>
            </div>
          </div>
          <div class="card">
            <h3>Today's Focus</h3>
            <p>• Train</p>
            <p>• Study</p>
            <p>• Build</p>
          </div>
        `;
      }

      if (page === "goals") {
        content.innerHTML = `
          <h1>Goals</h1>
          <div class="card">
            <p>No goals added yet.</p>
          </div>
        `;
      }

      if (page === "streak") {
        content.innerHTML = `
          <h1>Streak</h1>
          <div class="card">
            <p>Current streak: 5 days</p>
          </div>
        `;
      }

      if (page === "profile") {
        content.innerHTML = `
          <h1>Profile</h1>
          <div class="card">
            <p>Name: User</p>
            <p>Rank: Bronze</p>
          </div>
        `;
      }
    }

    showPage("dashboard", document.querySelector(".menu-item"));
  </script>

</body>
</html>
