<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Ascend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0e0e0e;
      color: white;
    }

    .sidebar {
      width: 220px;
      background-color: #141414;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      margin-bottom: 40px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .menu-item {
      margin-bottom: 20px;
      cursor: pointer;
      color: #aaa;
      transition: 0.2s;
    }

    .menu-item:hover {
      color: white;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      background-color: #1c1c1c;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .xp-bar {
      width: 100%;
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      margin-top: 10px;
    }

    .xp-fill {
      width: 40%;
      height: 100%;
      background-color: white;
      border-radius: 5px;
    }

    h1 {
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <h2>SYSTEM</h2>
    <div class="menu-item">Dashboard</div>
    <div class="menu-item">Goals</div>
    <div class="menu-item">Streak</div>
    <div class="menu-item">Profile</div>
  </div>

  <div class="main">
    <h1>Welcome back.</h1>

    <div class="card">
      <h3>Level 4</h3>
      <p>XP: 240 / 500</p>
      <div class="xp-bar">
        <div class="xp-fill"></div>
      </div>
    </div>

    <div class="card">
      <h3>Today's Focus</h3>
      <p>• Train</p>
      <p>• Study</p>
      <p>• Build</p>
    </div>

  </div>

</body>
</html>
